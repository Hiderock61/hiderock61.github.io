<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>アフィリエイト差分分析アプリ v0.1</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171a;--muted:#65707c;--line:#dfe4ea;--accent:#111;--soft:#eef2f6;--ok:#e9f7ef;--warn:#fff5d9;--bad:#fdebea;--radius:16px}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:rgba(246,247,249,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:1120px;margin:auto;padding:18px}.brand{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}
nav{display:flex;gap:8px;overflow:auto;padding-top:14px}.tab{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:999px;white-space:nowrap;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1120px;margin:auto;padding:22px 18px 70px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}.metric{font-size:28px;font-weight:750}.muted{color:var(--muted)}
button,.btn{border:0;background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px;font-weight:650;cursor:pointer}.secondary{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.danger{background:#8a1c1c}.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:12px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--soft);font-size:12px}.pill.own{background:#eaf0ff}.pill.comp{background:#f2eafe}.pill.ok{background:var(--ok)}.pill.warn{background:var(--warn)}
input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font:inherit}textarea{min-height:86px;resize:vertical}label{font-size:13px;font-weight:700}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}
.caseItem,.versionItem{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}.caseItem:hover{border-color:#aab3bd}.click{cursor:pointer}.tiny{font-size:12px}.divider{height:1px;background:var(--line);margin:8px 0}.warnbox{background:var(--warn);border:1px solid #ecd99a;padding:12px;border-radius:12px}.okbox{background:var(--ok);border:1px solid #bee2ca;padding:12px;border-radius:12px}.badbox{background:var(--bad);border:1px solid #efc4c1;padding:12px;border-radius:12px}
.compareGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.kv{display:grid;grid-template-columns:140px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border-bottom:0}.sectionTitle{font-size:18px;margin:0 0 12px}.hidden{display:none!important}.empty{padding:30px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}.modalBox{background:#fff;border-radius:20px 20px 0 0;width:min(820px,100%);max-height:90vh;overflow:auto;padding:20px}.modal h2{margin-top:0}
@media(max-width:760px){.span4,.span6,.span8{grid-column:span 12}.formgrid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.brand{align-items:flex-start}.brand .row{justify-content:flex-end}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand"><div><h1>📊 アフィリエイト差分分析アプリ <span class="pill">v0.1</span></h1><small>CASE → VERSION → RESULT WINDOW → 比較 → 次回変更</small></div><div class="row"><button class="secondary" onclick="exportData()">JSON書出し</button><button class="secondary" onclick="document.getElementById('importFile').click()">JSON読込</button><input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="importData(event)"><button class="ghost" onclick="resetSeed()">サンプル初期化</button></div></div><nav id="nav"></nav></div></header>
<main id="app"></main><div id="modalRoot"></div>

const seed={

   {id:'v1',label:'v1 初稿',date:'2026-09-01',title:'AI議事録ツール5選',intro:'機能を先に一覧化',headings:'特徴 / 料金 / まとめ',wordCount:2600,firstParty:false,table:true,visual:false,productRelation:'比較中心',ctaCount:1,ctaPosition:'末尾',linkCount:2,linkPlacement:'各商品の末尾',changed:'初稿',results:[{id:'r1',start:'2026-09-02',end:'2026-09-08',searchImpressions:420,searchClicks:18,ctr:4.29,position:11.8,affiliateClicks:5,conversions:0,revenue:0}]},
   {id:'v2',label:'v2 体験追記＋CTA移動',date:'2026-09-09',title:'AI議事録ツール5選｜実際に試して比較',intro:'自分で使った条件を先に提示',headings:'使った条件 / 比較表 / 各ツール / 料金 / まとめ',wordCount:3300,firstParty:true,table:true,visual:true,productRelation:'比較＋体験',ctaCount:2,ctaPosition:'比較表直後＋末尾',linkCount:3,linkPlacement:'比較表＋各商品の末尾',changed:'一次情報追加, CTA位置変更',results:[{id:'r2',start:'2026-09-10',end:'2026-09-16',searchImpressions:610,searchClicks:39,ctr:6.39,position:9.6,affiliateClicks:12,conversions:2,revenue:5400}]}
  ]},
  {id:'c2',type:'own',url:'https://example.local/cheap-mic',topic:'配信用マイク',intent:'予算内で選びたい',memo:'架空の自分記事',versions:[{id:'v3',label:'v1',date:'2026-09-05',title:'安い配信用マイク7選',intro:'価格帯から紹介',headings:'予算別 / 製品 / まとめ',wordCount:2100,firstParty:false,table:true,visual:false,productRelation:'商品比較',ctaCount:2,ctaPosition:'中盤＋末尾',linkCount:7,linkPlacement:'各商品',changed:'初稿',results:[{id:'r3',start:'2026-09-06',end:'2026-09-12',searchImpressions:180,searchClicks:7,ctr:3.89,position:18.2,affiliateClicks:2,conversions:null,revenue:null}]}]},
  {id:'c3',type:'competitor',url:'https://competitor.example/a',topic:'AI議事録ツール',intent:'比較して選びたい',memo:'架空の競合観測A。本文コピーなし。',versions:[{id:'v4',label:'観測 2026-09-12',date:'2026-09-12',title:'AI議事録ツール比較',intro:'用途別の結論から開始',headings:'結論 / 比較表 / 用途別 / 各ツール / FAQ',wordCount:3900,firstParty:true,table:true,visual:true,productRelation:'用途別比較',ctaCount:3,ctaPosition:'比較表＋本文中＋末尾',linkCount:5,linkPlacement:'比較表＋本文',changed:'観測スナップショット',results:[]}]},
  {id:'c4',type:'competitor',url:'https://competitor.example/b',topic:'AI議事録ツール',intent:'比較して選びたい',memo:'架空の競合観測B。本文コピーなし。',versions:[{id:'v5',label:'観測 2026-09-12',date:'2026-09-12',title:'会議録AIおすすめ',intro:'悩み別に入口を分岐',headings:'選び方 / 比較 / 製品 / 注意点',wordCount:3100,firstParty:false,table:true,visual:false,productRelation:'比較中心',ctaCount:2,ctaPosition:'比較表＋末尾',linkCount:4,linkPlacement:'比較表＋本文',changed:'観測スナップショット',results:[]}]}
  ,{id:'real001',type:'own',url:'https://note.com/note_id_hiderock/n/n2a286f817056',topic:'GitHub Copilot × Web制作',intent:'GitHub Copilot / VS Codeの新機能とWeb制作への影響を知りたい',memo:'CASE-REAL-001｜実公開note記事。2026-09-25に実ページからVERSION v1を観測登録。',experimentStatus:'WAITING_MANUAL_BASELINE',versions:[{id:'real001_v1',label:'v1 公開時観測',date:'2026-08-10',title:'コード知らなくても「ここ直して」！GitHub CopilotがWeb制作を“施工監督方式”へ変え始めた📰AIデイリーニュース｜2026年8月9日版',intro:'🎙️重要ニュース｜Web画面を見て、「ここ」と指定してAIへ修正依頼。HiderockとGPTの対話から開始。',headings:'🎙️重要ニュース / 今までと何が違うのか / 「この余白いらない」が、そのまま施工指示になる / 🎙️音声入力も強化 / 🎙️「今ちょっと聞きたい」も作業を止めない / 🎙️Copilot Autoは「誰がやったか」を後から見せる / 🎙️Notionも同じ方向 / 💻AIによる分析結果 / 📝編集後記',wordCount:null,firstParty:false,table:false,visual:false,productRelation:'AIニュース・解説。商品比較／アフィリエイト訴求ではない',ctaCount:1,ctaPosition:'末尾（noteチップ支援CTA）',linkCount:0,linkPlacement:'本文中の外部／アフィリエイトリンクは確認できず',changed:'公開時の初期観測。RESULT WINDOWは未登録',results:[]},{id:'real001_v2_draft',label:'v2 候補（未反映）',date:'',title:'GitHub CopilotでWeb画面を指して「ここ直して」｜VS Code 1.132の新機能でWeb制作はどう変わる？',intro:'🎙️重要ニュース｜Web画面を見て、「ここ」と指定してAIへ修正依頼。HiderockとGPTの対話から開始。',headings:'🎙️重要ニュース / 今までと何が違うのか / 「この余白いらない」が、そのまま施工指示になる / 🎙️音声入力も強化 / 🎙️「今ちょっと聞きたい」も作業を止めない / 🎙️Copilot Autoは「誰がやったか」を後から見せる / 🎙️Notionも同じ方向 / 💻AIによる分析結果 / 📝編集後記',wordCount:null,firstParty:false,table:false,visual:false,productRelation:'AIニュース・解説。商品比較／アフィリエイト訴求ではない',ctaCount:1,ctaPosition:'末尾（noteチップ支援CTA）',linkCount:0,linkPlacement:'本文中の外部／アフィリエイトリンクは確認できず',changed:'タイトルのみ変更予定。実note記事には未反映',results:[]}]}

 ], plans:[]
};
let state=load(); let route='dashboard'; let activeCase=null; let lastCompare=null;
function migrate(data){const real=seed.cases.find(c=>c.id==='real001'); if(real){let target=data.cases.find(c=>c.id==='real001'); if(!target){data.cases.push(structuredClone(real));}else{target.versions=target.versions||[]; for(const version of real.versions){if(!target.versions.some(v=>v.id===version.id)) target.versions.push(structuredClone(version));}}} for(const c of data.cases||[]){for(const v of c.versions||[]){for(const r of v.results||[]){if(r.searchImpressions==null&&r.impressions!=null)r.searchImpressions=r.impressions;if(!Object.prototype.hasOwnProperty.call(r,'noteImpressions'))r.noteImpressions=null;if(!Object.prototype.hasOwnProperty.call(r,'pageViews'))r.pageViews=null;if(!Object.prototype.hasOwnProperty.call(r,'searchReferrerPV'))r.searchReferrerPV=null;if(!Object.prototype.hasOwnProperty.call(r,'likes'))r.likes=null;if(!Object.prototype.hasOwnProperty.call(r,'observationMode'))r.observationMode=null;if(!Object.prototype.hasOwnProperty.call(r,'sourceLabel'))r.sourceLabel=null;if(!Object.prototype.hasOwnProperty.call(r,'sourceUrl'))r.sourceUrl=null;if(!Object.prototype.hasOwnProperty.call(r,'retrievedAt'))r.retrievedAt=null;}}} for(const c of data.cases||[])syncExperimentStatus(c); return data}
function baselineReady(c){const v=c?.versions?.find(v=>v.id==='real001_v1');return !!v?.results?.some(r=>r&&r.start&&r.end&&r.sourceLabel&&r.retrievedAt&&r.noteImpressions!=null&&r.pageViews!=null&&r.likes!=null)}
function syncExperimentStatus(c){if(c?.id==='real001')c.experimentStatus=baselineReady(c)?'BASELINE_READY':'WAITING_MANUAL_BASELINE';return c?.experimentStatus}
function experimentGate(c){if(c?.id!=='real001')return '';const ready=baselineReady(c);return ready?`<div class="okbox"><b>BASELINE_READY</b>｜v1の手動観測3値が揃いました。次工程へ進めます。</div>`:`<div class="warnbox"><b>WAITING_MANUAL_BASELINE</b>｜v1の 2026-09-18〜09-24 の「note内表示 / PV / スキ」待ち。v2候補は保持しますが、実ページ反映・新VERSION作成は止めます。</div>`}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function resetSeed(){if(confirm('保存データを消してサンプルに戻しますか？')){state=structuredClone(seed);save();route='dashboard';activeCase=null;render()}}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
const tabs=[['dashboard','ダッシュボード'],['cases','CASE'],['compare','比較'],['plans','次回変更']];
function renderNav(){document.getElementById('nav').innerHTML=tabs.map(([k,l])=>`<button class="tab ${route===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(r){route=r;activeCase=null;render()}
function render(){renderNav(); const app=document.getElementById('app'); if(route==='dashboard') app.innerHTML=dashboard(); if(route==='cases') app.innerHTML=casesView(); if(route==='compare') app.innerHTML=compareView(); if(route==='plans') app.innerHTML=plansView(); bindCompare();}
function allVersions(){return state.cases.flatMap(c=>c.versions.map(v=>({c,v})))}
function dashboard(){const own=state.cases.filter(c=>c.type==='own').length, comp=state.cases.length-own, vers=allVersions().length, withRes=allVersions().filter(x=>x.v.results?.length).length; return `<div class="grid">
<div class="card span4"><div class="muted">CASE</div><div class="metric">${state.cases.length}</div><div class="tiny">自分 ${own} / 競合 ${comp}</div></div>
<div class="card span4"><div class="muted">VERSION</div><div class="metric">${vers}</div><div class="tiny">記事状態のスナップショット</div></div>
<div class="card span4"><div class="muted">結果記録あり</div><div class="metric">${withRes}</div><div class="tiny">RESULT WINDOW付き</div></div>
<div class="card span8"><h2 class="sectionTitle">現在の実験</h2>${state.plans.length?state.plans.slice(-3).reverse().map(planCard).join(''):'<div class="empty">比較結果から「次回変更」を作るとここに出ます。</div>'}</div>
<div class="card span4"><h2 class="sectionTitle">v0.1の守り</h2><div class="stack"><div class="warnbox">因果は断定しない。観測された関連と候補を分ける。</div><div class="okbox">CASE / VERSION / RESULT WINDOW を分離する。</div><div class="card">未取得 ≠ 0。欠損は欠損のまま残す。</div></div></div>
</div>`}
function casesView(){if(activeCase){const c=state.cases.find(x=>x.id===activeCase); return caseDetail(c)} return `<div class="row between"><div><h2>CASE一覧</h2><div class="muted">記事そのもの。改良前後はVERSIONで分ける。</div></div><button onclick="openCaseModal()">＋ 新規CASE</button></div><div class="stack" style="margin-top:16px">${state.cases.map(c=>`<div class="caseItem click" onclick="openCase('${c.id}')"><div class="row between"><div><span class="pill ${c.type==='own'?'own':'comp'}">${c.type==='own'?'自分記事':'競合観測'}</span> <b>${esc(c.topic)}</b></div><span class="muted tiny">${c.versions.length} VERSION</span></div><div style="margin-top:8px">${esc(c.url)}</div><div class="muted tiny">検索意図：${esc(c.intent||'未設定')}</div></div>`).join('')}</div>`}
function openCase(id){activeCase=id;render()}
function caseDetail(c){const blocked=c.id==='real001'&&!baselineReady(c);return `<div class="row between"><div><button class="secondary" onclick="activeCase=null;render()">← 一覧</button><h2>${esc(c.topic)}</h2><div class="muted">${esc(c.intent||'')} · ${esc(c.url)}</div></div><div class="row"><button class="secondary" onclick="openResultModal('${c.id}')">＋ RESULT</button><button ${blocked?'disabled title="v1の手動観測3値が揃うまで新VERSIONは作成しません"':''} onclick="openVersionModal('${c.id}')">＋ VERSION</button></div></div>${experimentGate(c)}<div class="stack" style="margin-top:16px">${[...c.versions].reverse().map(v=>versionCard(c,v)).join('')}</div>`}
function versionCard(c,v){const r=v.results?.[v.results.length-1]; return `<div class="versionItem"><div class="row between"><div><b>${esc(v.label)}</b> <span class="pill">${v.date||''}</span></div><span class="tiny muted">${esc(v.changed||'変更記録なし')}</span></div><div class="divider"></div><div class="kv"><b>タイトル</b><span>${esc(v.title||'')}</span></div><div class="kv"><b>観測</b><span>一次情報 ${yn(v.firstParty)} / 比較表 ${yn(v.table)} / 図 ${yn(v.visual)} / CTA ${n(v.ctaCount)}</span></div><div class="kv"><b>RESULT</b><span>${r?`${r.start}〜${r.end}｜Google検索表示 ${nullable(r.searchImpressions)}｜Google検索Click ${nullable(r.searchClicks)}｜Google CTR ${val(r.ctr,'%')}｜note内表示 ${nullable(r.noteImpressions)}｜PV ${nullable(r.pageViews)}｜スキ ${nullable(r.likes)}｜検索流入PV(全体参考) ${nullable(r.searchReferrerPV)}｜Aff Click ${nullable(r.affiliateClicks)}｜成約 ${nullable(r.conversions)}｜収益 ${money(r.revenue)}${r.sourceLabel?`｜出典 ${esc(r.sourceLabel)}`:''}${r.retrievedAt?`｜取得 ${esc(r.retrievedAt.replace('T',' '))}`:''}`:'未取得'}</span></div></div>`}
function openCaseModal(){modal(`<h2>新規CASE</h2><form onsubmit="createCase(event)" class="formgrid"><div><label>種別</label><select name="type"><option value="own">自分記事</option><option value="competitor">競合観測</option></select></div><div><label>テーマ</label><input name="topic" required></div><div class="full"><label>URL</label><input name="url" required></div><div class="full"><label>検索意図</label><input name="intent" placeholder="例：比較して選びたい"></div><div class="full"><label>メモ</label><textarea name="memo"></textarea></div><div class="full row"><button>保存</button><button type="button" class="secondary" onclick="closeModal()">取消</button></div></form>`)}
function createCase(e){e.preventDefault(); const f=new FormData(e.target); state.cases.push({id:uid('c'),type:f.get('type'),topic:f.get('topic'),url:f.get('url'),intent:f.get('intent'),memo:f.get('memo'),versions:[]});save();closeModal();render()}
function openVersionModal(cid,cloneId){const c=state.cases.find(x=>x.id===cid); const src=cloneId?c.versions.find(v=>v.id===cloneId):{}; modal(`<h2>VERSION追加</h2><form onsubmit="createVersion(event,'${cid}')" class="formgrid"><div><label>ラベル</label><input name="label" value="${attr(src?.label?src.label+' 次版':'v'+(c.versions.length+1))}" required></div><div><label>日付</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="full"><label>タイトル</label><input name="title" value="${attr(src?.title||'')}"></div><div class="full"><label>冒頭の特徴</label><textarea name="intro">${esc(src?.intro||'')}</textarea></div><div class="full"><label>見出し構成</label><textarea name="headings">${esc(src?.headings||'')}</textarea></div><div><label>文章量</label><input type="number" name="wordCount" value="${n(src?.wordCount)}"></div><div><label>商品との関係</label><input name="productRelation" value="${attr(src?.productRelation||'')}"></div><div><label>一次情報</label><select name="firstParty"><option value="false">なし</option><option value="true" ${src?.firstParty?'selected':''}>あり</option></select></div><div><label>比較表</label><select name="table"><option value="false">なし</option><option value="true" ${src?.table?'selected':''}>あり</option></select></div><div><label>図</label><select name="visual"><option value="false">なし</option><option value="true" ${src?.visual?'selected':''}>あり</option></select></div><div><label>CTA数</label><input type="number" name="ctaCount" value="${n(src?.ctaCount)}"></div><div><label>CTA位置</label><input name="ctaPosition" value="${attr(src?.ctaPosition||'')}"></div><div><label>リンク数</label><input type="number" name="linkCount" value="${n(src?.linkCount)}"></div><div><label>リンク配置</label><input name="linkPlacement" value="${attr(src?.linkPlacement||'')}"></div><div class="full"><label>この版で変えた点（カンマ区切り推奨）</label><textarea name="changed">${esc(src?.changed||'')}</textarea></div><div class="full row"><button>VERSION保存</button><button type="button" class="secondary" onclick="closeModal()">取消</button></div></form>`)}
function createVersion(e,cid){e.preventDefault();const f=new FormData(e.target), c=state.cases.find(x=>x.id===cid);c.versions.push({id:uid('v'),label:f.get('label'),date:f.get('date'),title:f.get('title'),intro:f.get('intro'),headings:f.get('headings'),wordCount:numOrNull(f.get('wordCount')),firstParty:f.get('firstParty')==='true',table:f.get('table')==='true',visual:f.get('visual')==='true',productRelation:f.get('productRelation'),ctaCount:numOrNull(f.get('ctaCount')),ctaPosition:f.get('ctaPosition'),linkCount:numOrNull(f.get('linkCount')),linkPlacement:f.get('linkPlacement'),changed:f.get('changed'),results:[]});save();closeModal();render()}
function openResultModal(cid){const c=state.cases.find(x=>x.id===cid); if(!c.versions.length){alert('先にVERSIONを作ってください');return} modal(`<h2>RESULT WINDOW追加</h2><form onsubmit="createResult(event,'${cid}')" class="formgrid"><div class="full"><label>対象VERSION</label><select name="vid">${c.versions.map(v=>`<option value="${v.id}">${esc(v.label)}</option>`).join('')}</select></div><div><label>開始日</label><input type="date" name="start" required></div><div><label>終了日</label><input type="date" name="end" required></div><div class="full warnbox">Google検索の表示回数とnote内インプレッションは別指標です。同じ箱に入れません。検索エンジン流入PVはnote標準ダッシュボードではアカウント全体値なので、CASE比較の主指標には使いません。</div><div class="full card"><b>手動観測パケット</b><div class="tiny muted">noteダッシュボード等を人間が見て転記する場合、数値と一緒に出典・取得日時を残します。</div></div><div><label>入力方法</label><select name="observationMode"><option value="manual">手動転記</option><option value="auto">自動取得</option></select></div><div><label>出典</label><input name="sourceLabel" value="note アクセス状況" placeholder="例：note アクセス状況"></div><div class="full"><label>出典URL（任意）</label><input type="url" name="sourceUrl" placeholder="https://..."></div><div class="full"><label>取得日時</label><input type="datetime-local" name="retrievedAt" required></div>${['searchImpressions|Google検索表示回数','searchClicks|Google検索クリック','ctr|Google検索CTR (%)','position|Google平均順位','noteImpressions|note内インプレッション','pageViews|記事PV','likes|スキ','searchReferrerPV|検索エンジン流入PV（アカウント全体・参考）','affiliateClicks|Affクリック','conversions|成約数','revenue|収益'].map(x=>{const [k,l]=x.split('|');return `<div><label>${l}</label><input type="number" step="any" name="${k}" placeholder="未取得なら空欄"></div>`}).join('')}<div class="full row"><button>RESULT保存</button><button type="button" class="secondary" onclick="closeModal()">取消</button></div></form>`) }
function createResult(e,cid){e.preventDefault();const f=new FormData(e.target),c=state.cases.find(x=>x.id===cid),v=c.versions.find(x=>x.id===f.get('vid'));v.results.push({id:uid('r'),start:f.get('start'),end:f.get('end'),observationMode:f.get('observationMode')||null,sourceLabel:f.get('sourceLabel')||null,sourceUrl:f.get('sourceUrl')||null,retrievedAt:f.get('retrievedAt')||null,searchImpressions:numOrNull(f.get('searchImpressions')),searchClicks:numOrNull(f.get('searchClicks')),ctr:numOrNull(f.get('ctr')),position:numOrNull(f.get('position')),noteImpressions:numOrNull(f.get('noteImpressions')),pageViews:numOrNull(f.get('pageViews')),likes:numOrNull(f.get('likes')),searchReferrerPV:numOrNull(f.get('searchReferrerPV')),affiliateClicks:numOrNull(f.get('affiliateClicks')),conversions:numOrNull(f.get('conversions')),revenue:numOrNull(f.get('revenue'))});syncExperimentStatus(c);save();closeModal();render()}
function compareView(){const items=allVersions();return `<div class="row between"><div><h2>比較ワークスペース</h2><div class="muted">2件以上のVERSIONを選ぶ。競合のRESULTが無くても構造差は比較可能。</div></div><button onclick="runCompare()">差分を見る</button></div><div class="compareGrid" style="margin-top:16px">${items.map(({c,v})=>`<label class="caseItem click"><input class="cmp" type="checkbox" value="${c.id}|${v.id}" style="width:auto;margin-right:8px"><span class="pill ${c.type==='own'?'own':'comp'}">${c.type==='own'?'自分':'競合'}</span> <b>${esc(c.topic)}</b><div class="tiny muted">${esc(v.label)}｜${esc(v.title||'')}</div></label>`).join('')}</div><div id="compareResult" style="margin-top:16px">${lastCompare?renderCompareResult(lastCompare):''}</div>`}
function bindCompare(){}
const fields=[['title','タイトル'],['intro','冒頭'],['headings','見出し構成'],['wordCount','文章量'],['firstParty','一次情報'],['table','比較表'],['visual','図'],['productRelation','商品との関係'],['ctaCount','CTA数'],['ctaPosition','CTA位置'],['linkCount','リンク数'],['linkPlacement','リンク配置']];
function runCompare(){const selected=[...document.querySelectorAll('.cmp:checked')].map(x=>x.value);if(selected.length<2){alert('2件以上選んでください');return}const arr=selected.map(key=>{const [cid,vid]=key.split('|'),c=state.cases.find(x=>x.id===cid),v=c.versions.find(x=>x.id===vid);return{c,v,r:v.results?.[v.results.length-1]||null}});const common=[],diff=[];fields.forEach(([k,l])=>{const vals=arr.map(x=>norm(x.v[k]));if(vals.every(x=>x===vals[0]))common.push({label:l,value:show(arr[0].v[k])});else diff.push({label:l,values:arr.map(x=>show(x.v[k]))})});const warnings=[];if(new Set(arr.map(x=>x.c.topic)).size>1)warnings.push('テーマが異なるCASEを比較しています。');if(new Set(arr.map(x=>x.c.intent)).size>1)warnings.push('検索意図が異なるCASEを比較しています。');const days=arr.map(x=>x.r?dateDays(x.r.start,x.r.end):null).filter(x=>x!==null);if(new Set(days).size>1)warnings.push('RESULT WINDOWの日数が一致していません。');if(arr.some(x=>!x.r))warnings.push('RESULT未取得のVERSIONがあります。構造差は見られますが結果差は未判定です。');if(arr.some(x=>(x.v.changed||'').split(',').map(s=>s.trim()).filter(Boolean).length>2))warnings.push('1つのVERSIONで3項目以上を同時変更しています。結果差の切り分けが弱くなります。');const result={arr,common,diff,warnings};lastCompare=result;document.getElementById('compareResult').innerHTML=renderCompareResult(result)}
function renderCompareResult(res){const metrics=[['searchImpressions','Google検索表示'],['searchClicks','Google検索クリック'],['ctr','Google検索CTR %'],['position','Google平均順位'],['noteImpressions','note内表示'],['pageViews','記事PV'],['likes','スキ'],['affiliateClicks','Affクリック'],['conversions','成約'],['revenue','収益']];return `<div class="grid"><div class="card span12"><h2 class="sectionTitle">比較結果</h2>${res.warnings.length?res.warnings.map(w=>`<div class="warnbox" style="margin:8px 0">⚠️ ${esc(w)}</div>`).join(''):'<div class="okbox">比較上の大きな警告は検出されませんでした。</div>'}</div><div class="card span6"><h3>共通点</h3>${res.common.length?res.common.map(x=>`<div class="kv"><b>${x.label}</b><span>${esc(x.value)}</span></div>`).join(''):'<div class="muted">固定項目の完全一致なし</div>'}</div><div class="card span6"><h3>差分</h3>${res.diff.map(x=>`<div class="kv"><b>${x.label}</b><span>${x.values.map((v,i)=>`<div><span class="pill">${i+1}</span> ${esc(v)}</div>`).join('')}</span></div>`).join('')}</div><div class="card span12"><h3>結果指標</h3><div class="compareGrid">${res.arr.map((x,i)=>`<div class="caseItem"><b>${i+1}. ${esc(x.c.topic)} / ${esc(x.v.label)}</b>${metrics.map(([k,l])=>`<div class="kv"><span>${l}</span><b>${x.r?formatMetric(k,x.r[k]):'未取得'}</b></div>`).join('')}</div>`).join('')}</div></div><div class="card span12"><h3>現時点の読み方</h3><div class="warnbox">これは観測差です。因果の証明ではありません。条件差・期間差・母数不足があれば「候補」または「データ不足」として扱います。</div><div class="row" style="margin-top:12px"><button onclick="openPlanModal()">この比較から次回変更を作る</button></div></div></div>`}
function openPlanModal(){if(!lastCompare)return;const opts=lastCompare.arr.filter(x=>x.c.type==='own').map(x=>`<option value="${x.c.id}|${x.v.id}">${esc(x.c.topic)} / ${esc(x.v.label)}</option>`).join('');if(!opts){alert('次VERSIONの基準にできる自分記事が選択されていません');return}modal(`<h2>次回変更を固定</h2><form onsubmit="createPlan(event)" class="formgrid"><div class="full"><label>基準VERSION</label><select name="base">${opts}</select></div><div class="full"><label>仮説（因果断定しない）</label><textarea name="hypothesis" placeholder="例：一次情報と比較表直後CTAがクリック増加と関連している可能性"></textarea></div><div class="full"><label>次回に変える1〜2点（カンマ区切り）</label><input name="changes" required placeholder="例：冒頭, CTA位置"></div><div class="full"><label>次に観測する期間</label><input name="window" placeholder="例：7日間"></div><div class="full row"><button>計画保存</button><button type="button" class="secondary" onclick="closeModal()">取消</button></div></form>`)}
function createPlan(e){e.preventDefault();const f=new FormData(e.target), parts=f.get('changes').split(',').map(s=>s.trim()).filter(Boolean);if(parts.length>2){alert('v0.1では次回変更は1〜2点に固定してください');return}const [cid,vid]=f.get('base').split('|');state.plans.push({id:uid('p'),cid,vid,hypothesis:f.get('hypothesis'),changes:parts,window:f.get('window'),status:'planned',created:new Date().toISOString()});save();closeModal();route='plans';render()}
function plansView(){return `<div class="row between"><div><h2>次回変更・実験計画</h2><div class="muted">比較から1〜2点だけ変えて次VERSIONへ送る。</div></div></div><div class="stack" style="margin-top:16px">${state.plans.length?state.plans.slice().reverse().map(planCard).join(''):'<div class="card empty">まだ計画はありません。比較画面から作成してください。</div>'}</div>`}
function planCard(p){const c=state.cases.find(x=>x.id===p.cid),v=c?.versions.find(x=>x.id===p.vid);return `<div class="card"><div class="row between"><div><span class="pill ${p.status==='planned'?'warn':'ok'}">${p.status==='planned'?'未実行':'次VERSION作成済み'}</span> <b>${esc(c?.topic||'')}</b></div><span class="tiny muted">基準 ${esc(v?.label||'')}</span></div><div class="kv"><b>仮説</b><span>${esc(p.hypothesis||'未記入')}</span></div><div class="kv"><b>変える点</b><span>${p.changes.map(esc).join(' / ')}</span></div><div class="kv"><b>観測期間</b><span>${esc(p.window||'未設定')}</span></div>${p.status==='planned'?`<button onclick="planToVersion('${p.id}')">この計画から次VERSIONを作る</button>`:''}</div>`}
function planToVersion(pid){const p=state.plans.find(x=>x.id===pid),c=state.cases.find(x=>x.id===p.cid);if(c?.id==='real001'&&!baselineReady(c)){alert('v1の手動観測3値が揃うまで次VERSIONへ進めません');return}const v=c.versions.find(x=>x.id===p.vid),nv=structuredClone(v);nv.id=uid('v');nv.label=v.label+' → 実験';nv.date=new Date().toISOString().slice(0,10);nv.changed=p.changes.join(', ');nv.results=[];c.versions.push(nv);p.status='version_created';p.newVid=nv.id;save();activeCase=c.id;route='cases';render()}
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalBox">${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='affiliate-diff-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validImportedState(x){return !!(x&&typeof x==='object'&&Array.isArray(x.cases)&&Array.isArray(x.plans)&&x.cases.every(c=>c&&typeof c==='object'&&Array.isArray(c.versions)&&c.versions.every(v=>v&&typeof v==='object'&&Array.isArray(v.results))))}
function importData(event){const file=event.target.files?.[0];event.target.value='';if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!validImportedState(parsed))throw new Error('形式不一致');if(!confirm(`CASE ${parsed.cases.length}件を読み込み、現在の保存データを置き換えますか？`))return;state=parsed;save();route='dashboard';activeCase=null;lastCompare=null;render();alert('JSONを復元しました。')}catch(e){alert('このJSONは読み込めません。アフィリエイト差分分析アプリの書出しJSONを選んでください。')}};reader.onerror=()=>alert('JSONファイルを読み込めませんでした。');reader.readAsText(file)}
function dateDays(a,b){if(!a||!b)return null;return Math.round((new Date(b)-new Date(a))/86400000)+1}
function numOrNull(x){return x===''||x===null?null:Number(x)} function n(x){return x===null||x===undefined||x===''?'':x} function nullable(x){return x===null||x===undefined?'未取得':x} function money(x){return x===null||x===undefined?'未取得':'¥'+Number(x).toLocaleString('ja-JP')} function val(x,s=''){return x===null||x===undefined?'未取得':x+s} function yn(x){return x?'あり':'なし'} function norm(x){return JSON.stringify(x??null)} function show(x){if(typeof x==='boolean')return yn(x); if(x===null||x===undefined||x==='')return '未取得';return String(x)}
function formatMetric(k,v){if(v===null||v===undefined)return '未取得';if(k==='revenue')return money(v);if(k==='ctr')return v+'%';return Number(v).toLocaleString('ja-JP')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function attr(s){return esc(s)}
render();
</script>
