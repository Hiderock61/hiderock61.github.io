<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎲 奇妙なカラクリ実験室｜ヒデロツク本館</title><style>body{margin:auto;max-width:600px;padding:20px;background:#101b29;color:#edf5ff;font-family:system-ui,-apple-system,sans-serif}a{color:#8fd3ff}.panel{background:#1b2b3c;border:1px solid #405468;border-radius:16px;padding:16px;margin:15px 0}button{background:#2bbda3;border:0;border-radius:10px;padding:13px;color:#09241e;font-weight:bold;font-size:16px;touch-action:manipulation}button:disabled{opacity:.4}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#345269;color:white}.tabs button.active{background:#2bbda3;color:#09241e}.dice{display:flex;align-items:center;justify-content:center;gap:20px;margin:25px}.die{display:grid;place-items:center;background:white;color:#152437;border-radius:15px;width:100px;height:100px;font-size:50px;font-weight:bold}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#102333;padding:12px;border-radius:10px}.stat strong{display:block;font-size:25px}.muted{color:#b8c8d5;font-size:14px}#history{max-height:160px;overflow:auto}</style></head><body><p><a href="/">← ヒデロツク本館</a></p><h1>🎲 奇妙なカラクリ実験室</h1><p>平均値は同じ5。でも A は B に、B は C に、C は A に勝ち越す。</p><section class="panel"><h2>01｜対戦実験</h2><div class="tabs"><button data-pair="0" class="active">A 対 B</button><button data-pair="1">B 対 C</button><button data-pair="2">C 対 A</button></div><p id="faces" class="muted"></p><div class="dice"><div class="die" id="d1">?</div>VS<div class="die" id="d2">?</div></div><p id="outcome" style="text-align:center">まだ振っていません</p><div class="actions"><button id="roll">🎲 1回振る</button><button id="hundred">100回実験</button><button id="reset">リセット</button></div></section><section class="panel"><h2>02｜理論と観測</h2><div class="stats"><div class="stat"><small>理論勝率（固定）</small><strong>55.56%</strong><small>20/36</small></div><div class="stat"><small>観測勝率（変動）</small><strong id="observed">未測定</strong><small id="count">0回・0勝</small></div></div><p id="diff" class="muted">未測定</p></section><section class="panel"><h2>03｜直近10回の記録</h2><div id="history" class="muted">記録なし</div></section><p class="muted">ネット通信・外部ライブラリ・データ送信なし。再読込で試行記録は消えます。理論勝率は厳密な数え上げ、観測勝率は有限回の標本です。</p><script>(function(){var dice={A:[2,2,4,4,9,9],B:[1,1,6,6,8,8],C:[3,3,5,5,7,7]},pairs=[['A','B'],['B','C'],['C','A']],stats=[{n:0,w:0,log:[]},{n:0,w:0,log:[]},{n:0,w:0,log:[]}],current=0;function el(id){return document.getElementById(id)}function face(){if(window.crypto&&window.crypto.getRandomValues){var a=new Uint32Array(1),limit=Math.floor(4294967296/6)*6,n;do{window.crypto.getRandomValues(a);n=a[0]}while(n>=limit);return n%6}return Math.floor(Math.random()*6)}function render(){var p=pairs[current],s=stats[current];el('faces').textContent=p[0]+': '+dice[p[0]].join(' · ')+' ／ '+p[1]+': '+dice[p[1]].join(' · ');el('observed').textContent=s.n?(100*s.w/s.n).toFixed(2)+'%':'未測定';el('count').textContent=s.n+'回・'+s.w+'勝';el('diff').textContent=s.n?'理論との差：'+((100*s.w/s.n)-(100*20/36)).toFixed(2)+'ポイント':'未測定';el('history').textContent=s.log.length?s.log.slice().reverse().join(' ／ '):'記録なし';document.querySelectorAll('[data-pair]').forEach(function(b){b.classList.toggle('active',Number(b.dataset.pair)===current)})}function roll(n){var p=pairs[current],s=stats[current],x,y;for(var i=0;i<n;i++){x=dice[p[0]][face()];y=dice[p[1]][face()];s.n++;if(x>y)s.w++;s.log.push(p[0]+' '+x+' : '+y+' '+p[1]);if(s.log.length>10)s.log.shift()}el('d1').textContent=x;el('d2').textContent=y;el('outcome').textContent=(x>y?p[0]:p[1])+'の勝ち！';render()}document.querySelectorAll('[data-pair]').forEach(function(b){b.addEventListener('click',function(){current=Number(b.dataset.pair);el('d1').textContent='?';el('d2').textContent='?';el('outcome').textContent='まだ振っていません';render()})});el('roll').addEventListener('click',function(){roll(1)});el('hundred').addEventListener('click',function(){roll(100)});el('reset').addEventListener('click',function(){stats[current]={n:0,w:0,log:[]};el('d1').textContent='?';el('d2').textContent='?';el('outcome').textContent='リセットしました';render()});render()})()</script></body></html>
