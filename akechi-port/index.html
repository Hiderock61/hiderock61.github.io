<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="85個のアプリを、通常の説明と機械的な副音声で並べた一覧。">
<title>目指せプラグイン大賞｜アプリ一覧</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#15181d;--line:#30353d;--text:#f4f4f2;--muted:#b9bec7;--accent:#ffd45f;--sub:#9fdcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;line-height:1.65}
main{max-width:1180px;margin:auto;padding:28px 20px 70px}a{color:var(--sub)}header{padding-bottom:24px;border-bottom:1px solid var(--line)}
.back{display:inline-block;min-height:44px;padding-top:8px;color:var(--muted);text-decoration:none}.kicker{color:var(--accent);font-size:.8rem;font-weight:800;letter-spacing:.1em}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.15;margin:.3em 0}.lead{max-width:880px;color:var(--muted);font-size:1.05rem}
.search{position:sticky;top:0;z-index:3;padding:14px 0;background:rgba(11,13,16,.95)}input{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#101318;color:var(--text);font:inherit}
.count{margin:4px 0 15px;color:var(--muted)}.list{display:grid;gap:12px}
.app{display:grid;grid-template-columns:minmax(230px,.8fr) minmax(0,1.7fr);border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.normal,.side{padding:18px}.normal{border-right:1px solid var(--line)}.number{color:var(--accent);font:700 .9rem ui-monospace,monospace}.app h2{margin:.25em 0 .6em;font-size:1.35rem}.label{margin:12px 0 3px;font-size:.74rem;font-weight:800;letter-spacing:.08em;color:var(--sub)}
.normal p,.side p{margin:0}.normal p{color:#d9dde3}.machine{padding:13px;border-left:3px solid var(--accent);background:#101318;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9rem;color:#e8e8e4}
.example{color:var(--muted)}.arrow{color:var(--accent);padding:0 .3em}.empty{padding:50px;text-align:center;color:var(--muted)}
footer{margin-top:35px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem}
@media(max-width:720px){main{padding:20px 14px 55px}.app{grid-template-columns:1fr}.normal{border-right:0;border-bottom:1px solid var(--line)}.normal,.side{padding:16px}}
</style>
</head>
<body>
<main>
<header>
<a class="back" href="/">← ひでろっく本館へ戻る</a>
<div class="kicker">🔌 目指せプラグイン大賞</div>
<h1>85個のアプリ一覧</h1>
<p class="lead">左は普通の説明。右の副音声は、そのアプリを機械として見た時の「きっかけ → 察知するもの → 起こす動作」。最後に具体例を1つ付けた。</p>
</header>
<div class="search"><input id="q" placeholder="アプリ名・普通の用途・副音声・例を検索…" autocomplete="off"></div>
<div id="count" class="count">85個</div>
<div id="list" class="list"></div>
<footer>副音声は、アプリの宣伝文句ではなく、仕組みを単純な部品として見るための説明。実機で確認済みかどうかとは別に扱う。</footer>
</main>
<script>
let apps=[];
const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dict=[
[/documentation/gi,"説明書"],[/repository/gi,"ファイルと変更履歴の置き場"],[/catalog/gi,"公式一覧"],[/recognize/gi,"認識する"],[/audio/gi,"音"],[/music/gi,"音楽"],[/artist/gi,"歌手"],[/album/gi,"アルバム"],[/song/gi,"曲"],[/playlist/gi,"曲リスト"],[/chart/gi,"順位表"],[/files?/gi,"ファイル"],[/branches?/gi,"作業の枝"],[/commits?/gi,"変更記録"],[/issues?/gi,"作業票"],[/reviews?/gi,"確認"],[/diff/gi,"変更差分"],[/patches?/gi,"修正差分"],[/permissions?/gi,"権限"],[/search/gi,"探す"],[/fetch/gi,"取り出す"],[/read/gi,"読む"],[/write/gi,"書く"],[/state/gi,"今の状態"],[/store/gi,"保管場所"],[/resolver/gi,"照合して正体を決める部品"],[/entity/gi,"固有の対象"],[/transform/gi,"形を変える"],[/compiler/gi,"材料を完成形式へ変える機械"],[/render/gi,"見える形にする"],[/runtime/gi,"動かす場所"],[/sensor/gi,"察知器"],[/trigger/gi,"開始のきっかけ"],[/action/gi,"動作"],[/observe/gi,"結果を見る"],[/recover/gi,"元へ戻す"],[/automation/gi,"自動で動かす"],[/workflow/gi,"作業の流れ"],[/pipeline/gi,"順番に通す管"],[/database|DB/gi,"データ置き場"],[/API/gi,"外部操作口"],[/schema/gi,"データの型"],[/graph/gi,"関係の網"],[/identity/gi,"誰・何かを特定する情報"],[/inventory/gi,"現在ある候補の棚"],[/async/gi,"終わるまで待つ処理"],[/poll/gi,"終わったか繰り返し確認"],[/deploy/gi,"公開場所へ出す"],[/human gate/gi,"人間確認の門"],[/read-only/gi,"読むだけ"],[/metadata/gi,"正式な付属情報"],[/source/gi,"元資料"],[/input/gi,"入力"],[/output/gi,"出力"],[/tool/gi,"道具"],[/job/gi,"処理仕事"],[/monitor/gi,"見張る"],[/control/gi,"制御"],[/framework/gi,"判断の型"],[/knowledge/gi,"知識"],[/relation/gi,"関係"],[/closed-loop/gi,"結果を次の動作へ戻す輪"],[/feedback/gi,"結果の戻り"],[//+/g,"・"]
];
function jp(s){let out=String(s||"");for(const [a,b] of dict)out=out.replace(a,b);return out.replace(/s*／s*/g,"、").replace(/s+/g," ").replace(/^[-・]s*/,"").trim()}
function shortParts(s,n){return jp(s).split(/[。、]/).map(x=>x.trim()).filter(Boolean).slice(0,n).join("・")}
function humanText(x){const t=jp(x.human).replace(/[。.]$/,"");return t+"をするアプリ。"}
function trigger(x){return jp(x.human)+"が必要になる"}
function sensing(x){const base=x.mechanism||x.runtime||x.design;return shortParts(base,2)||"必要な情報を見つける"}
function action(x){const d=shortParts(x.design,2);return d||"情報を処理して結果を返す"}
function example(x){const raw=x.connection||x.when||x.unusual||x.graft;return shortParts(raw,2)||("例："+jp(x.human)+"が必要な場面で、対象を入れて結果を受け取る")}
function card(x){const ex=example(x).replace(/^例[:：]s*/,"");return '<article class="app"><section class="normal"><div class="number">'+esc(x.no)+'</div><h2>'+esc(x.name)+'</h2><div class="label">通常の説明</div><p>'+esc(humanText(x))+'</p></section><section class="side"><div class="label">副音声｜機械として見る</div><p class="machine">きっかけ：'+esc(trigger(x))+'<br><span class="arrow">↓</span><br>察知：'+esc(sensing(x))+'<br><span class="arrow">↓</span><br>動作：'+esc(action(x))+'</p><div class="label">例</div><p class="example">'+esc(ex)+'</p></section></article>'}
function render(){const q=document.querySelector("#q").value.trim().toLowerCase();const rows=apps.filter(x=>!q||[x.no,x.name,x.human,x.mechanism,x.runtime,x.design,x.connection,x.when].join(" ").toLowerCase().includes(q));document.querySelector("#count").textContent=rows.length+" / 85個";document.querySelector("#list").innerHTML=rows.length?rows.map(card).join(""):'<div class="empty">一致するアプリがありません。</div>'}
fetch("./catalog.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{apps=d.items;render()}).catch(e=>document.querySelector("#list").innerHTML='<div class="empty">読込に失敗しました：'+esc(e.message)+'</div>');
document.querySelector("#q").addEventListener("input",render);
</script>
</body>
</html>
