<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AKECHI PORT レイアウト検査</title>
<style>body{font:16px system-ui;background:#eee;color:#111;margin:20px}button,select{font:inherit;padding:8px}iframe{border:0;background:#0e1015;transform-origin:top left}#preview{overflow:hidden;margin-top:20px}pre{white-space:pre-wrap}#result{background:#fff;padding:16px}h1{font-size:24px}</style>
<h1>AKECHI PORT レイアウト検査</h1><p>制作側の検査画面。幅はCSS px。iPhone実機・TV実機の検査ではありません。</p>
<label>画面幅 <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1440</option><option>2560</option></select></label>
<button id="run">全幅を検査</button><button id="card">Elicitを表示</button><button id="print">印刷レイアウトを印刷</button>
<pre id="result" aria-live="polite">読込中</pre><div id="preview"><iframe id="frame" title="図鑑プレビュー" src="./index.html" width="390" height="844"></iframe></div>
<script>
const frame=document.querySelector('#frame'),out=document.querySelector('#result'),pick=document.querySelector('#width');
const pause=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
function resize(w){frame.style.width=w+'px';const scale=Math.min(1,(innerWidth-40)/w);frame.style.transform=`scale(${scale})`;document.querySelector('#preview').style.height=844*scale+'px'}
function report(){const d=frame.contentDocument,w=frame.contentWindow,cards=[...d.querySelectorAll('.plugin-card')];return{width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,cardCount:cards.length,genreCount:d.querySelectorAll('.genre-section').length,open:cards.filter(c=>c.open).length,bodyPx:w.getComputedStyle(d.body).fontSize,flowPx:w.getComputedStyle(d.querySelector('.machine-flow dd')).fontSize,columns:w.getComputedStyle(d.querySelector('.perspectives')).gridTemplateColumns,contentWidth:Math.round(d.querySelector('main').getBoundingClientRect().width)}}
frame.addEventListener('load',()=>{resize(+pick.value);out.textContent=JSON.stringify(report(),null,2)});
pick.addEventListener('change',async()=>{resize(+pick.value);await pause();out.textContent=JSON.stringify(report(),null,2)});
document.querySelector('#run').onclick=async()=>{const d=frame.contentDocument,cards=[...d.querySelectorAll('.plugin-card')],results=[];for(const width of [320,390,768,1440,2560]){resize(width);cards.forEach(c=>c.open=false);await pause();const closed=report();cards.forEach(c=>c.open=true);await pause();results.push({closed,expanded:report()})}cards.forEach(c=>c.open=false);resize(+pick.value);out.textContent=JSON.stringify(results,null,2)};
document.querySelector('#card').onclick=()=>{const d=frame.contentDocument;d.querySelector('#clear').click();const card=d.querySelector('#plugin-elicit');card.open=true;card.scrollIntoView()};
document.querySelector('#print').onclick=()=>frame.contentWindow.print();
</script></html>
