name: AKECHI PORT capability resync

on:
  push:
    branches: [main]
    paths:
      - 'akechi-port/capability-updates/*.json'
      - 'akechi-port/tools/apply-capability-update.py'
      - '.github/workflows/akechi-capability-resync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Apply capability update packets
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' packet; do
            echo "Applying $packet"
            python akechi-port/tools/apply-capability-update.py \
              "$packet" \
              akechi-port/capabilities.json
          done < <(
            find akechi-port/capability-updates \
              -maxdepth 1 -type f -name '*.json' -print0 |
            sort -z
          )

      - name: Commit synced manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add akechi-port/capabilities.json

          if git diff --cached --quiet; then
            echo 'No manifest changes.'
            exit 0
          fi

          git commit -m 'Sync AKECHI PORT capability evidence'
          git push
