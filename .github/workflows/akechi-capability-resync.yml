name: AKECHI PORT capability resync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akechi-capability-resync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply capability delta #057
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path('akechi-port/capabilities.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          records = data['records']

          old_send = [37, 30, 4, 'メッセージを送る', 14, 18]
          new_send = [37, 30, 0, 'メッセージを送る', 14, 57]

          matches = [i for i, row in enumerate(records) if row == old_send]
          if len(matches) != 1:
              raise SystemExit(f'expected 1 Slack legacy SEND row, matches={len(matches)}')

          records[matches[0]] = new_send

          data['coverage']['tests'] = '#001-#057'
          data['coverage']['capability_records'] = len(records)
          status_names = data['dict']['status']
          counts = Counter(status_names[row[2]] for row in records)
          data['status_counts'] = {name: counts.get(name, 0) for name in status_names}
          data['latest_update'] = '#057 Slack send PROVEN (L5); HUMAN GATE retained'

          path.write_text(
              json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8'
          )

          assert data['coverage']['capability_records'] == 248
          assert data['status_counts']['PROVEN'] == 138
          assert data['status_counts']['UNKNOWN'] == 85
          assert new_send in data['records']
          print(data['coverage'])
          print(data['status_counts'])
          print(data['latest_update'])
          PY

      - name: Commit synced manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add akechi-port/capabilities.json
          if git diff --cached --quiet; then
            echo 'No manifest changes.'
            exit 0
          fi
          git commit -m 'Sync Slack #057 capability evidence'
          git push
